name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize and publish
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:electron
      - name: Refuse to publish an unsigned build
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release secrets are missing:$missing. See docs/releasing.md."
            exit 1
          fi
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build, sign and notarize
        run: npm run build:release
      # The DMG keeps one name across releases, so
      # https://github.com/VelvetAcorn/agent-auto-continue/releases/latest/download/Agent-Auto-Continue.dmg
      # always serves the newest one. electron-builder signs it (dmg.sign); Apple notarizes it here.
      - name: Notarize and staple the disk image
        run: |
          dmg=dist/Agent-Auto-Continue.dmg
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
      - name: Verify what will be published
        run: |
          app="$(ls -d dist/mac-universal/*.app)"
          dmg=dist/Agent-Auto-Continue.dmg
          version="$(node -p "require('./package.json').version")"
          zip="dist/agent-auto-continue-$version-universal.zip"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          # The updater reads its feed from the app and the release; both must name the versioned ZIP.
          test -f "$app/Contents/Resources/app-update.yml"
          test -f "$zip" && test -f "$zip.blockmap"
          grep -q "path: agent-auto-continue-$version-universal.zip" dist/latest-mac.yml
          grep -q "version: $version" dist/latest-mac.yml
      - name: Write checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip latest-mac.yml *.blockmap > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # latest-mac.yml and the blockmap are what installed copies read to find and download the update.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Agent-Auto-Continue.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
