name: Validate scheduler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check production JavaScript
        run: npm run check:syntax
  package:
    name: Package macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:electron
      # Packaging only. The build scripts pass --publish never, so CI never tries to publish a release.
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
