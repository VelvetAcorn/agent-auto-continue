name: Bug report
description: Something does not work the way the README says it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the menu bar tooltip, or the release you downloaded.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Agent harness
      options:
        - T3 Code
        - Claude Code
        - Codex
        - OpenCode
        - Other (say which below)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings and …
        2. Schedule a message for …
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any token before pasting. The app never logs the token, but check anyway.
