<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">T3 CODE AUTO-CONTINUE</p>
      <h1>Settings</h1>
      <p class="hint">The app communicates only with T3 Code on your Mac at 127.0.0.1.</p>
      <form id="form">
        <label for="token">T3 bearer token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste a token to save or replace it">
        <p id="token-status" class="hint"></p>
        <label for="port">Local HTTP port</label>
        <input id="port" type="number" min="1" max="65535" required>
        <label for="buffer">Safety buffer (seconds)</label>
        <input id="buffer" type="number" min="0" max="300" required>
        <p class="hint">Use a small buffer if you are scheduling just after a provider limit resets.</p>
        <p id="error" class="error" role="alert"></p>
        <div class="actions">
          <button type="button" class="secondary" id="cancel">Close</button>
          <button type="submit" id="submit">Save settings</button>
        </div>
      </form>
    </main>
    <script>
      (() => {
        const form = document.getElementById('form');
        const token = document.getElementById('token');
        const port = document.getElementById('port');
        const buffer = document.getElementById('buffer');
        const error = document.getElementById('error');
        const submit = document.getElementById('submit');
        document.getElementById('cancel').addEventListener('click', () => window.close());
        window.autoContinue.getSettings().then((settings) => {
          port.value = settings.httpPort;
          buffer.value = settings.bufferSeconds;
          document.getElementById('token-status').textContent = settings.usingEnvironmentToken
            ? 'Using T3_TOKEN from the environment for this launch.'
            : settings.hasStoredToken ? 'A token is stored locally. Leave this field empty to keep it.' : 'No token has been saved yet.';
        });
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          error.textContent = '';
          submit.disabled = true;
          try {
            await window.autoContinue.saveSettings({ t3Token: token.value, httpPort: Number(port.value), bufferSeconds: Number(buffer.value) });
            window.close();
          } catch (reason) {
            error.textContent = reason.message || 'Could not save settings.';
            submit.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
